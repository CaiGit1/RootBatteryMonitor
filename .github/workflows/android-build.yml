name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 刻意**不使用** android-actions/setup-android@v3。
      #
      # 它内部固定执行 `sdkmanager tools`，而 Google 已从 SDK 仓库移除 legacy `tools` 包，
      # 于是该动作必然报 "Warning: Failed to find package 'tools'" 并以 exit 1 中断整个
      # job —— 与工程代码无关，是动作本身年久失修（实测日志见 #7 号运行的 setup 步骤）。
      #
      # runner 镜像（ubuntu-latest）已自带 SDK 与 cmdline-tools，直接用即可，
      # 这样也少一个第三方动作的供应链面。
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # runner 镜像自带的 SDK 平台版本会随镜像漂移，而本工程要求
      # compileSdk 35 / build-tools 34.0.0，缺包会直接构建失败，故显式装齐。
      - name: Install required SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "platform-tools"

      # 环境快照：构建失败时能一眼区分「环境没装对」还是「代码编译不过」
      - name: Print toolchain info
        run: |
          echo "===== Java ====="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "===== Android SDK ====="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version || true
          echo "--- platforms ---"
          ls -1 "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "(none)"
          echo "--- build-tools ---"
          ls -1 "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || echo "(none)"

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
