name: Release

# 推送 v* 标签即自动构建并发布 GitHub Release（用内置 GITHUB_TOKEN，无需个人令牌）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # 创建 Release 与上传附件需要写权限；其余保持只读
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不使用 android-actions/setup-android@v3：它内部固定执行 `sdkmanager tools`，
      # 而 Google 已移除 legacy `tools` 包，该动作必然失败。详见 android-build.yml 的注释。
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install required SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "platform-tools"

      # 没有发布密钥库就**直接失败**，不发布。
      #
      # 早先的版本会回退到 debug 签名并照常发布 —— 那是个错误设计：debug 签名
      # （CN=Android Debug）与正式密钥（CN=Root Battery Monitor）完全是两把钥匙，
      # 发出去之后装了正式版的人会遇到签名冲突、无法覆盖更新。
      # 宁可不发，也不能发一个签名不对的包。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置发布密钥库 Secrets，拒绝发布。"
            echo "原因：不签名或用 debug 签名产出的包与正式版签名不一致，使用者无法覆盖安装。"
            echo "请在仓库 Settings → Secrets and variables → Actions 中添加："
            echo "  KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            echo "生成方式见 RELEASE-NOTES.md 的「关于签名」。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "已注入发布密钥库"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then echo "没有找到 release APK 产物" >&2; exit 1; fi
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="RootBatteryMonitor-${VERSION}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # 把签名者打进日志：签名对不对必须看得见，而不是等使用者装上才发现
      - name: Verify APK signature
        run: |
          APK="${{ steps.apk.outputs.path }}"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if ! grep -q "CN=Root Battery Monitor" /tmp/certs.txt; then
            echo "::error::APK 不是用预期发布密钥签名的，中止发布。"
            exit 1
          fi
          ls -lh "$APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.apk.outputs.version }}"
          APK="${{ steps.apk.outputs.path }}"

          # 清掉可能残留的、签名不一致的旧附件（例如早先误发的 debug 包）
          gh release delete-asset "$TAG" "RootBatteryMonitor-${VERSION}-debug.apk" --yes 2>/dev/null || true
          gh release delete-asset "$TAG" "app-debug.apk" --yes 2>/dev/null || true

          # 幂等：已存在就更新，不存在才创建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "Root Battery Monitor ${TAG}" \
              --notes-file RELEASE-NOTES.md
          else
            gh release create "$TAG" "$APK" \
              --title "Root Battery Monitor ${TAG}" \
              --notes-file RELEASE-NOTES.md \
              --verify-tag
          fi
